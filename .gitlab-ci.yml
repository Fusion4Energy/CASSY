image: python:latest
# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
# https://pip.pypa.io/en/stable/topics/caching/
cache:
  paths:
    - .cache/pip
before_script:
  - python --version ; python -m pip --version  # For debugging
  - python -m pip install virtualenv
  - python -m virtualenv venv
  - source venv/bin/activate

stages:
  - test
  - deploy
  - release


test:
  script:
    # - pip install ruff tox  # you can also use tox
    # - pip install --editable ".[test]"
    # - tox -e py,ruff
    - pip install .[dev]
    - pytest
# run:
#   script:
#     - pip install .
#     # run the command here
#   artifacts:
#     paths:
#       - build/*
# pages:
#   script:
#     - pip install sphinx sphinx-rtd-theme
#     - cd doc
#     - make html
#     - mv build/html/ ../public/
#   artifacts:
#     paths:
#       - public
#   rules:
#     - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
deploy:
  stage: deploy
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: never
  environment: production
  rules:  # Create the wheel only on tags on main
    - if: '$CI_COMMIT_TAG'
#
release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  needs: [deploy]
  before_script: []  # <--- This disables the global before_script for this job
  script: echo "Creating GitLab Release and attaching artifacts"
  rules:
    - if: '$CI_COMMIT_TAG'
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "CASSY release $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Wheel (.whl)"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/dist/*.whl"
        - name: "Source (.tar.gz)"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/dist/*.tar.gz"
