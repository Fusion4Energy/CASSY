#   artifacts:
#     paths:
#       - public
#   rules:
#     - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
deploy:
  variables:
      python: "/usr/bin/python3.12"
  stage: deploy
  script:
    - $python -m pip install build
    - $python -m build
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: never
  environment: production
  rules:  # Create the wheel only on tags on main
    - if: '$CI_COMMIT_TAG'