name: Inconel 718
description: From Appendix A of the SDC-IC
properties:
  Poisson Ratio:
    type: constant
    value: 0.31
  Young Modulus:
    type: equation
    lower_bound: [20, null] # degrees Celsius
    upper_bound: [500, null] # degrees Celsius
    equation: 2.01E+05 - 6.19E+01*T + 5.57E-02*T**2 - 8.32E-05*T**3
    args: ["T", "DPA"] # in Celsius
    scale_result: 1e6 # to convert GPa to Pa. (missing /1000 in the formula)
  Min Yield Strength:
    type: multi
    ranges:
      # Unirradiated
      - type: equation
        lower_bound: [20, 0] # degrees Celsius
        upper_bound: [500, 0.01] # degrees Celsius
        equation: -1.63E-06*T**3 + 1.72E-03*T**2 - 7.43E-01*T + 1.05E+03
        args: ["T", "DPA"] # in Celsius
        scale_result: 1e6 # to convert MPa to Pa
      # Irradiated
      - type: table2D
        scale_result: 1e6 # to convert MPa to Pa
        values:
          x: [20, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600] # degrees Celsius
          y: [0.01, 10] # DPA
          vals: [
            [880, 880],
            [864, 864],
            [842, 842],
            [826, 826],
            [813, 813],
            [804, 804],
            [797, 797],
            [791, 791],
            [785, 785],
            [778, 778],
            [769, 769],
            [757, 757],
            [740, 740]
          ]
  Min Tensile Strength:
    type: table2D
    scale_result: 1e6 # to convert MPa to Pa
    values:
      x: [20, 50, 65, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600]
      y: [0, 0.01, 10] # DPA
      vals: [
        [1275, 1084, 1084],
        [1263, 1074, 1074],
        [1258, 1069, 1069],
        [1244, 1057, 1057],
        [1225, 1041, 1041],
        [1206, 1025, 1025],
        [1187, 1009, 1009],
        [1169, 994, 994],
        [1151, 978, 978],
