name: CuCrZr-IG Tr B
description: From Appendix A of the SDC-IC
properties:
  Poisson Ratio:
    type: constant
    value: 0.33
  Young Modulus:
    type: equation
    lower_bound: [20, null] # degrees Celsius
    upper_bound: [700, null] # degrees Celsius
    equation: 128 - 2.59E-02*T - 4.87E-05*T**2
    args: ["T", "DPA"] # in Celsius
    scale_result: 1e9 # to convert GPa to Pa. (missing /1000 in the formula)
  Min Yield Strength:
    type: multi
    ranges:
      # Unirradiated
      - type: table2D
        values:
          x: [20, 50, 80, 100, 150, 200, 250, 300, 350, 400, 450, 500] # degrees Celsius
          y: [0, 0.29999]
          vals: [[241, 241],
                 [237, 237],
                 [232, 232],
                 [229, 229],
                 [220, 220],
                 [210, 210],
                 [198, 198],
                 [185, 185],
                 [171, 171],
                 [155, 155],
                 [138, 138],
                 [120, 120]]
        scale_result: 1e6 # to convert MPa to Pa
      # Irradiated
      - type: table1D
        values:
          x: [80, 100, 150, 200, 250, 300] # degrees Celsius
          y: [0.3, 5] # DPA
          vals: [[402, 402],
                 [389, 389],
                 [358, 358],
                 [341, 341],
                 [280, 280],
                 [218, 218]]
        args: ["T", "DPA"] # in Celsius
        scale_result: 1e6 # to convert MPa to Pa
  Min Tensile Strength:
    type: multi
    ranges:
      # Unirradiated
      - type: table2D
        values:
          x: [20, 50, 80, 100, 150, 200, 250, 300, 350, 400, 450, 500] # degrees Celsius
          y: [0, 0.29999]
          vals: [[369, 369],
                 [356, 356],
                 [348, 348],
                 [336, 336],
                 [317, 317],
                 [297, 297],
                 [278, 278],
                 [259, 259],
                 [238, 238],
                 [216, 216],
                 [193, 193],
                 [170, 170],
                 [167, 167]]
        args: ["T", "DPA"] # in Celsius
        scale_result: 1e6 # to convert MPa to Pa
      # Irradiated
      - type: table2D
        values:
          x: [80, 100, 150, 200, 250, 300] # degrees Celsius
          y: [0.3, 5] # DPA
          vals: [[406, 406],
                 [396, 396],
                 [371, 371],
                 [356, 356],
                 [313, 313],
                 [270, 270]]
        args: ["T", "DPA"] # in Celsius
        scale_result: 1e6 # to convert MPa to Pa
  Sm: 
    type: multi
    ranges:
      # Unirradiated
      - type: table2D
        values:
          x: [20, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500] # degrees Celsius
          y: [0, 1e-3]
          vals: [[123, 123],
                 [123, 123],
                 [123, 123],
                 [117, 117],
                 [110, 110],
                 [103, 103],
                 [96, 96],
                 [88, 88],
                 [80, 80],
                 [71, 71],
                 [62, 62]]
        args: ["T", "DPA"] # in Celsius
        scale_result: 1e6 # to convert MPa to Pa
      # Irradiated
      - type: table2D
        values:
          x: [20, 50, 100, 150, 200, 250, 300] # degrees Celsius
          y: [1e-3, 100] # DPA
          vals: [[123, 123],
                 [123, 123],
                 [123, 123],
                 [117, 117],
                 [110, 110],
                 [103, 103],
                 [96, 96]]
        args: ["T", "DPA"] # in Celsius
        scale_result: 1e6 # to convert MPa to Pa
  Keff_rec:
    type: table2D
    values:
      x: [50, 100, 150, 200, 250, 300, 350] # degrees Celsius
      y: [0, 100] # DPA
      vals: [[1.44, 1.44],
             [1.45, 1.45],
             [1.46, 1.46],
             [1.49, 1.49],
             [1.50, 1.50],
             [1.50, 1.50],
             [1.50, 1.50]]
  Fatigue:
    type: fatigue
    ftype: strain
    scale_y: 1e2 # to from relative to percent
    values:
      T: [20, 350] # degrees Celsius
      N_cycles: [10, 20, 40, 1e2, 2e2, 4e2, 1e3, 2e3, 4e3, 1e4, 2e4, 4e4, 1e5, 2e5, 4e5, 1e6] # N cycles
      y: [
          [2.29, 2.29],
          [1.78, 1.78],
          [1.395, 1.395],
          [1.026, 1.026],
          [0.824, 0.824],
          [0.672, 0.672],
          [0.526, 0.526],
          [0.447, 0.447],
          [0.376, 0.376],
          [0.308, 0.308],
          [0.2631, 0.2631],
          [0.2233, 0.2233],
          [0.1852, 0.1852],
          [0.1644, 0.1644],
          [0.1487, 0.1487],
          [0.1336, 0.1336],
