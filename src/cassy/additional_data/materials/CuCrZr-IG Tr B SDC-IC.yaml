  Se:
    type: table2D
    values:
      x: [20, 50, 80, 100, 150, 200, 250, 300, 350, 400, 450, 500] # degrees Celsius
      y: [1e-3, 100] # DPA
      vals: [[123, 123],
             [123, 123],
             [117, 117],
             [110, 110],
             [103, 103],
             [96, 96]]
      scale_result: 1e6 # to convert MPa to Pa
  Sd:
    type: table2D
    values:
      x: [50, 100, 150] # degrees Celsius
      y: [1e-3, 100] # DPA
      vals: [[296, 296],
             [394, 394],
             [492, 492]]
  Sd_nopeak:
    type: table2D
    values:
      x: [50, 100, 150, 200, 250, 300] # degrees Celsius
      y: [1e-3, 100] # DPA
      vals: [[241, 240],
             [237, 237],
             [235, 235],
             [223, 223],
             [421, 421],
             [727, 727]]
  Keps:
    type: table2D
    values:
      # if sigma < 100 MPa set Keps = 1
      x: [20, 200, 350] # degrees Celsius
      y: [100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700] # d_sigma MPa
      vals: [
        [1.000, 1.001, 1.009, 1.055, 1.146, 1.258, 1.377, 1.499, 1.622, 1.745, 1.867, 1.989, 2.109],
        [1.000, 1.002, 1.027, 1.111, 1.233, 1.367, 1.505, 1.644, 1.783, 1.921, 2.058, 2.193, 2.328],
        [1.000, 1.008, 1.074, 1.205, 1.359, 1.519, 1.680, 1.840, 1.999, 2.156, 2.312, 2.466, 2.619],
      ]
    scale_y: 1e-6 # inputs to interpolate are in Pa, to be converted to MPa
  Kmu:
    type: table2D
    values:
      # if sigma < 100 MPa set Kmu = 1
      x: [20, 200, 350] # degrees Celsius
      y: [100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700] # d_sigma MPa  
      vals: [
        [1.000, 1.000, 1.006, 1.032, 1.074, 1.116, 1.152, 1.183, 1.210, 1.232, 1.251, 1.268, 1.283],
        [1.000, 1.010, 1.040, 1.080, 1.120, 1.160, 1.190, 1.220, 1.240, 1.260, 1.280],
        [1.000, 1.010, 1.040, 1.080, 1.120, 1.160, 1.190, 1.220, 1.240, 1.260, 1.280],
      ]
    scale_y: 1e-6 # inputs to interpolate are in Pa, to be converted to MPa