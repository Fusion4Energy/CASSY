name: CuCrZr-IG Tr A
description: From Appendix A of the SDC-IC (ITER_D_222RLN v3.3), A.S31, treatment A (solution annealing + cold work + ageing)
properties:
  Poisson Ratio:
    type: constant
    value: 0.33
  Young Modulus:
    type: equation
    lower_bound: [20, null] # degrees Celsius
    upper_bound: [700, null] # degrees Celsius
    equation: 128 - 2.59E-02*T - 4.87E-05*T**2
    args: ["T", "DPA"] # in Celsius
    scale_result: 1e9 # to convert GPa to Pa. (missing /1000 in the formula)
  Keff_rec:
    type: table2D
    values:
      x: [20,50, 100, 150, 200, 250, 300, 350] # degrees Celsius
      y: [0, 100] # DPA
      vals: [[1.434, 1.434],
             [1.44, 1.44],
             [1.45, 1.45],
             [1.46, 1.46],
             [1.49, 1.49],
             [1.50, 1.50],
             [1.50, 1.50],
             [1.50, 1.50]]
  Fatigue:
    type: fatigue
    ftype: strain
    scale_y: 1e2 # to from relative to percent
    values:
      T: [20, 350] # degrees Celsius
      N_cycles: [10, 20, 40, 1e2, 2e2, 4e2, 1e3, 2e3, 4e3, 1e4, 2e4, 4e4, 1e5, 2e5, 4e5, 1e6] # N cycles
      y: [
          [2.29, 2.29],
          [1.78, 1.78],
          [1.395, 1.395],
          [1.026, 1.026],
          [0.824, 0.824],
          [0.672, 0.672],
          [0.526, 0.526],
          [0.447, 0.447],
          [0.376, 0.376],
          [0.308, 0.308],
          [0.2631, 0.2631],
          [0.2233, 0.2233],
          [0.1852, 0.1852],
          [0.1644, 0.1644],
          [0.1487, 0.1487],
          [0.1336, 0.1336],
        ] # in %
  Keps:
    type: table2D
    values:
      # if sigma < 100 MPa set Keps = 1
      x: [20, 200, 350] # degrees Celsius
      y: [0, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700] # d_sigma MPa
      vals: [
        [1.000, 1.000, 1.001, 1.009, 1.055, 1.146, 1.258, 1.377, 1.499, 1.622, 1.745, 1.867, 1.989, 2.109],
        [1.000, 1.000, 1.002, 1.027, 1.111, 1.233, 1.367, 1.505, 1.644, 1.783, 1.921, 2.058, 2.193, 2.328],
        [1.000, 1.000, 1.008, 1.074, 1.205, 1.359, 1.519, 1.680, 1.840, 1.999, 2.156, 2.312, 2.466, 2.619],
      ]
    scale_y: 1e-6 # inputs to interpolate are in Pa, to be converted to MPa
  Kmu:
    type: table2D
    values:
      # if sigma < 100 MPa set Kmu = 1
      x: [20, 200, 350] # degrees Celsius
      y: [0, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700] # d_sigma MPa  
      vals: [
        [1.000, 1.000, 1.000, 1.006, 1.032, 1.074, 1.116, 1.152, 1.183, 1.210, 1.232, 1.251, 1.268, 1.283],
        [1.000, 1.000, 1.001, 1.017, 1.059, 1.107, 1.149, 1.185, 1.214, 1.238, 1.259, 1.277, 1.292, 1.306],
        [1.000, 1.000, 1.005, 1.041, 1.097, 1.147, 1.188, 1.221, 1.247, 1.270, 1.288, 1.304, 1.318, 1.330],
      ]
    scale_y: 1e-6 # inputs to interpolate are in Pa, to be converted to MPa
  Min Yield Strength:
    type: multi
    ranges:
      # Unirradiated, Table A.S31.3.2-1
      - type: table2D
        values:
          x: [20, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500] # degrees Celsius
          y: [0, 0.29999] # DPA
          vals: [[407, 407],
                 [397, 397],
                 [381, 381],
                 [365, 365],
                 [348, 348],
                 [331, 331],
                 [313, 313],
                 [294, 294],
                 [275, 275],
                 [254, 254],
                 [233, 233]]
        scale_result: 1e6 # to convert MPa to Pa
      # Irradiated, Table A.S31.3.2-1
      - type: table2D
